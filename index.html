<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Novel Reader</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Pridi:wght@400;600;700&family=Sarabun:wght@400;500;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'retro-bg': '#FAF6E9',
                        'cream-100': '#FDFBF7',
                        'cream-200': '#F4EAD5',
                        'retro-brown': '#4A3B32',
                        'retro-red': '#D9534F',
                    },
                    fontFamily: {
                        'heading': ['Pridi', 'serif'],
                        'body': ['Sarabun', 'sans-serif'],
                    },
                    boxShadow: {
                        'retro': '4px 4px 0px 0px rgba(74, 59, 50, 1)',
                        'retro-hover': '2px 2px 0px 0px rgba(74, 59, 50, 1)',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #FAF6E9;
            background-image: radial-gradient(#E5DCC5 1px, transparent 1px);
            background-size: 20px 20px;
        }
        /* Custom Scrollbar for a neat look */
        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: #F4EAD5; 
            border-left: 2px solid #4A3B32;
        }
        ::-webkit-scrollbar-thumb {
            background: #4A3B32; 
        }
    </style>
</head>
<body class="font-body text-retro-brown antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-cream-100 border-b-4 border-retro-brown shadow-retro sticky top-0 z-10">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="font-heading font-bold text-2xl tracking-wide flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-retro-red"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
                คลังนิยายจุ๊ๆ
            </h1>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-5xl mx-auto px-4 py-8 w-full">
        
        <!-- View 1: Bookshelf (Main Page) -->
        <div id="mainView" class="block">
            <h2 class="font-heading text-xl font-bold mb-6 border-b-2 border-retro-brown pb-2 inline-block">📚 ชั้นหนังสือนิยาย</h2>
            
            <!-- Loading Indicator -->
            <div id="loadingState" class="flex flex-col items-center justify-center py-12">
                <div class="animate-spin rounded-full h-12 w-12 border-b-4 border-retro-brown mb-4"></div>
                <p class="font-bold text-lg">กำลังดึงข้อมูลจาก Google Sheets...</p>
            </div>

            <!-- Error/Fallback Message -->
            <div id="errorMessage" class="hidden mb-6 bg-yellow-100 border-l-4 border-yellow-500 text-yellow-700 p-4 shadow-retro" role="alert">
                <p class="font-bold">เชื่อมต่อ Google Sheets ไม่สำเร็จ!</p>
                <p class="text-sm">ระบบกำลังแสดงผลจาก "ข้อมูลสำรอง" แทน</p>
            </div>

            <!-- Filter Section -->
            <div id="filterSection" class="hidden mb-6 bg-cream-200 p-3 sm:p-4 border-2 border-retro-brown shadow-retro rounded-md flex flex-col sm:flex-row gap-4 items-start sm:items-center">
                <div class="font-bold text-lg flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                    ค้นหา:
                </div>
                <div class="flex-grow flex flex-wrap gap-3 w-full sm:w-auto">
                    <select id="typeFilter" class="flex-1 min-w-[120px] p-2 border-2 border-retro-brown bg-white rounded-md outline-none focus:ring-2 focus:ring-retro-red font-bold text-retro-brown cursor-pointer">
                        <option value="all">ทุกประเภท</option>
                    </select>
                    <select id="categoryFilter" class="flex-1 min-w-[120px] p-2 border-2 border-retro-brown bg-white rounded-md outline-none focus:ring-2 focus:ring-retro-red font-bold text-retro-brown cursor-pointer">
                        <option value="all">ทุกหมวดหมู่</option>
                    </select>
                </div>
            </div>

            <div id="novelsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6 hidden">
                <!-- Novel Series Cards will be injected here -->
            </div>
        </div>

        <!-- View 1.5: Chapters List -->
        <div id="chaptersView" class="hidden block">
            <div class="flex items-center gap-4 mb-6 bg-cream-200 p-3 sm:p-4 border-2 border-retro-brown shadow-retro rounded-md">
                <button id="backToMainBtn" class="flex items-center gap-2 px-3 py-2 sm:px-4 sm:py-2 bg-cream-100 border-2 border-retro-brown font-bold text-retro-brown hover:bg-retro-brown hover:text-cream-100 transition-colors shadow-[2px_2px_0_0_rgba(74,59,50,1)] active:translate-y-[2px] active:translate-x-[2px] active:shadow-none text-sm sm:text-base">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
                    <span class="hidden sm:inline">กลับชั้นหนังสือ</span>
                    <span class="sm:hidden">กลับ</span>
                </button>
                <h2 id="seriesTitleDisplay" class="font-heading text-lg sm:text-xl font-bold truncate">ชื่อซีรีส์</h2>
            </div>
            
            <div id="chaptersGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
                <!-- Chapter Cards will be injected here -->
            </div>
        </div>

        <!-- View 2: Reading Mode -->
        <div id="readingView" class="hidden h-[80vh] flex flex-col">
            <div class="flex justify-between items-center mb-6 bg-cream-200 p-3 sm:p-4 border-2 border-retro-brown shadow-retro rounded-md">
                <div class="flex items-center gap-2 sm:gap-4 flex-wrap">
                    <button id="backToChaptersBtn" class="flex items-center gap-2 px-3 py-2 sm:px-4 sm:py-2 bg-cream-100 border-2 border-retro-brown font-bold text-retro-brown hover:bg-retro-brown hover:text-cream-100 transition-colors shadow-[2px_2px_0_0_rgba(74,59,50,1)] active:translate-y-[2px] active:translate-x-[2px] active:shadow-none text-sm sm:text-base">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
                        <span class="hidden sm:inline">กลับไปรายการเล่ม</span>
                        <span class="sm:hidden">กลับ</span>
                    </button>
                </div>
                <h2 id="readingTitle" class="font-heading text-base sm:text-xl font-bold truncate max-w-[30%] sm:max-w-[40%] text-right">ชื่อนิยาย</h2>
            </div>

            <!-- Iframe Container for Google Docs/Drive -->
            <div class="iframe-container flex-grow border-4 border-retro-brown shadow-retro bg-white rounded-lg overflow-hidden relative">
                <!-- Loading state for iframe -->
                <div id="iframeLoading" class="absolute inset-0 bg-cream-100 flex flex-col items-center justify-center z-10">
                    <div class="animate-spin rounded-full h-10 w-10 border-b-4 border-retro-brown mb-3"></div>
                    <p class="font-bold">กำลังเปิดหน้ากระดาษ...</p>
                </div>
                <iframe id="docIframe" class="w-full h-full border-none" src="about:blank" title="Novel Reader"></iframe>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-retro-brown text-cream-100 py-4 text-center border-t-4 border-black mt-auto">
        <p class="font-heading text-sm">&copy; 2024 Retro Novel Reader</p>
    </footer>

    <script>
        // ข้อมูลจำลองเพื่อให้คุณเห็นตัวอย่างการจัดกลุ่มใน Preview ทันที
        const fallbackData = [
            { series: "Cinderella", link: "https://docs.google.com/document/d/1a3yMfD5wzmndecU6rxAJawJdgKiqCFqkM4AqTFLXLp4/edit", title: "Cinderella Bloodhound 1", type: "นิยาย", category: "ชายหญิง, โรแมนติก, สืบสวน" },
            { series: "Cinderella", link: "https://docs.google.com/document/d/1a3yMfD5wzmndecU6rxAJawJdgKiqCFqkM4AqTFLXLp4/edit", title: "Cinderella hunting the lion 2", type: "นิยาย", category: "ชายหญิง, โรแมนติก, สืบสวน" },
            { series: "องค์ชายอัปลักษณ์", link: "https://docs.google.com/document/d/1a3yMfD5wzmndecU6rxAJawJdgKiqCFqkM4AqTFLXLp4/edit", title: "องค์ชายอัปลักษณ์ 1", type: "มังงะ", category: "ชายชาย, โรแมนติก, ย้อนยุค, เทพเซียน" }
        ];

        // API URL (ถ้าคุณ Deploy Apps Script ใหม่อาจจะต้องเปลี่ยนลิ้งค์นี้ หรือถ้าใช้ลิ้งค์เดิมก็ไม่ต้องเปลี่ยนครับ)
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzh3EXwWUyuAEedmZUTlaluYhBUmeRbNGPLfYxE-24BGs7LU1oLsORVxwDSnGMvmvZU/exec';
        
        let groupedNovels = {};
        let currentSeries = '';
        let allTypes = new Set();
        let allCategories = new Set();

        // Elements
        const mainView = document.getElementById('mainView');
        const chaptersView = document.getElementById('chaptersView');
        const readingView = document.getElementById('readingView');
        const novelsGrid = document.getElementById('novelsGrid');
        const chaptersGrid = document.getElementById('chaptersGrid');
        const loadingState = document.getElementById('loadingState');
        const errorMessage = document.getElementById('errorMessage');
        const backToMainBtn = document.getElementById('backToMainBtn');
        const backToChaptersBtn = document.getElementById('backToChaptersBtn');
        const docIframe = document.getElementById('docIframe');
        const readingTitle = document.getElementById('readingTitle');
        const seriesTitleDisplay = document.getElementById('seriesTitleDisplay');
        const iframeLoading = document.getElementById('iframeLoading');
        const filterSection = document.getElementById('filterSection');
        const typeFilter = document.getElementById('typeFilter');
        const categoryFilter = document.getElementById('categoryFilter');

        async function fetchNovelsData() {
            try {
                const response = await fetch(APPS_SCRIPT_URL);
                if (!response.ok) throw new Error('Network response was not ok');
                
                const data = await response.json();
                
                if (data && data.length > 0) {
                    processData(data);
                } else {
                    throw new Error("No data found or sheet is empty");
                }
            } catch (error) {
                console.error('Error fetching data:', error);
                processData(fallbackData); // โชว์ข้อมูลจำลองถ้าโหลดไม่ติด
                errorMessage.classList.remove('hidden');
            } finally {
                loadingState.classList.add('hidden');
                filterSection.classList.remove('hidden');
                novelsGrid.classList.remove('hidden');
            }
        }

        function processData(data) {
            groupedNovels = {};
            allTypes.clear();
            allCategories.clear();

            data.forEach(item => {
                // จัดการข้อมูล ดึงชื่อซีรีส์ และชื่อเล่ม
                const seriesName = item.series || item.title; 
                const chapterTitle = item.title || item.series || "ตอนที่ 1";
                const link = item.link;
                const type = item.type ? item.type.trim() : "ไม่ระบุ";
                const categoryStr = item.category ? item.category : "";

                if (!seriesName) return;

                // สร้างกลุ่มนิยายใหม่ถ้ายังไม่มี พร้อมเก็บ metadata
                if (!groupedNovels[seriesName]) {
                    groupedNovels[seriesName] = {
                        chapters: [],
                        type: type,
                        categories: new Set()
                    };
                }
                
                // เก็บหมวดหมู่แบบแยกคำ (Split ด้วย comma)
                if (categoryStr) {
                    const cats = categoryStr.split(',').map(c => c.trim()).filter(c => c);
                    cats.forEach(c => {
                        groupedNovels[seriesName].categories.add(c);
                        allCategories.add(c); // เก็บลง set รวมเพื่อไปทำ dropdown
                    });
                }

                if (type !== "ไม่ระบุ" && type !== "") {
                    allTypes.add(type);
                }

                if (link) {
                    groupedNovels[seriesName].chapters.push({
                        title: chapterTitle,
                        link: link
                    });
                }
            });
            
            populateFilters();
            renderSeries();
        }

        function populateFilters() {
            // ล้างค่าเก่า ยกเว้น option แรก
            typeFilter.innerHTML = '<option value="all">ทุกประเภท</option>';
            categoryFilter.innerHTML = '<option value="all">ทุกหมวดหมู่</option>';

            Array.from(allTypes).sort().forEach(type => {
                const opt = document.createElement('option');
                opt.value = type;
                opt.textContent = type;
                typeFilter.appendChild(opt);
            });

            Array.from(allCategories).sort().forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = cat;
                categoryFilter.appendChild(opt);
            });
        }

        // หน้าแรก: โชว์รายชื่อซีรีส์ พร้อมกรองข้อมูล
        function renderSeries() {
            novelsGrid.innerHTML = '';
            
            const selectedType = typeFilter.value;
            const selectedCat = categoryFilter.value;
            let count = 0;

            Object.keys(groupedNovels).forEach(seriesName => {
                const seriesData = groupedNovels[seriesName];
                const chapters = seriesData.chapters;

                // กรองข้อมูล
                const matchType = (selectedType === 'all') || (seriesData.type === selectedType);
                const matchCat = (selectedCat === 'all') || (seriesData.categories.has(selectedCat));

                if (!matchType || !matchCat) return; // ข้ามถ้าไม่ตรงเงื่อนไข
                
                count++;
                
                // สร้าง tag หมวดหมู่
                const catBadges = Array.from(seriesData.categories).map(cat => 
                    `<span class="inline-block bg-white border border-retro-brown text-xs px-2 py-0.5 rounded-full whitespace-nowrap mb-1 mr-1">${cat}</span>`
                ).join('');

                const typeBadge = seriesData.type !== "ไม่ระบุ" ? 
                    `<div class="absolute top-[-12px] right-[-12px] bg-retro-red text-cream-100 font-bold text-xs px-3 py-1 rounded border-2 border-retro-brown shadow-[2px_2px_0_0_rgba(74,59,50,1)] rotate-3 z-10">${seriesData.type}</div>` : '';

                const card = document.createElement('div');
                card.className = "bg-cream-100 border-2 border-retro-brown rounded-lg p-5 shadow-retro hover:shadow-retro-hover hover:translate-y-1 hover:translate-x-1 transition-all cursor-pointer flex flex-col h-full relative mt-2 mr-2";
                
                card.innerHTML = `
                    ${typeBadge}
                    <div class="flex-grow">
                        <div class="w-12 h-12 bg-cream-200 border-2 border-retro-brown rounded-full flex items-center justify-center mb-3 shadow-[2px_2px_0_0_rgba(74,59,50,1)]">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-retro-brown"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
                        </div>
                        <h3 class="font-heading font-bold text-xl mb-1 line-clamp-2">${seriesName}</h3>
                        <p class="text-sm font-bold opacity-80 text-retro-red mb-3">มี ${chapters.length} เล่ม/ตอน</p>
                        <div class="flex flex-wrap mt-2">
                            ${catBadges}
                        </div>
                    </div>
                `;

                card.addEventListener('click', () => openChaptersView(seriesName));
                novelsGrid.appendChild(card);
            });
            
            if (count === 0) {
                novelsGrid.innerHTML = `
                    <div class="col-span-full py-12 text-center border-2 border-dashed border-retro-brown rounded-lg bg-cream-200">
                        <p class="font-bold text-lg text-retro-brown">อ๊ะ! ไม่พบเรื่องที่ตรงกับเงื่อนไข</p>
                        <p class="text-sm">ลองเปลี่ยนหมวดหมู่หรือประเภทดูนะ</p>
                    </div>
                `;
            }
        }

        // หน้าสอง: โชว์รายชื่อเล่มเมื่อกดเข้ามาในซีรีส์
        function openChaptersView(seriesName) {
            currentSeries = seriesName;
            seriesTitleDisplay.textContent = seriesName;
            chaptersGrid.innerHTML = '';

            const chapters = groupedNovels[seriesName];

            chapters.forEach(chapter => {
                const card = document.createElement('div');
                card.className = "bg-cream-200 border-2 border-retro-brown rounded-lg p-4 shadow-[2px_2px_0_0_rgba(74,59,50,1)] hover:shadow-none hover:translate-y-[2px] hover:translate-x-[2px] transition-all cursor-pointer flex flex-col h-full justify-between";
                
                card.innerHTML = `
                    <h4 class="font-bold text-base mb-3 line-clamp-2 text-retro-brown">${chapter.title}</h4>
                    <button class="w-full py-1.5 bg-retro-brown text-cream-100 text-sm font-bold rounded border-2 border-retro-brown hover:bg-cream-100 hover:text-retro-brown transition-colors">
                        เปิดอ่าน
                    </button>
                `;

                card.addEventListener('click', () => openReadingMode(chapter));
                chaptersGrid.appendChild(card);
            });

            mainView.classList.add('hidden');
            chaptersView.classList.remove('hidden');
        }

        // หน้าสาม: โหมดอ่านนิยาย
        function openReadingMode(chapter) {
            readingTitle.textContent = chapter.title;
            
            // แปลงลิงก์สำหรับใส่ใน Iframe
            let embedUrl = chapter.link;
            if (embedUrl.includes('/edit')) {
                embedUrl = embedUrl.replace(/\/edit.*?$/, '/preview');
            } else if (embedUrl.includes('/view')) {
                embedUrl = embedUrl.replace(/\/view.*?$/, '/preview');
            }

            iframeLoading.style.display = 'flex';
            docIframe.src = embedUrl;

            chaptersView.classList.add('hidden');
            readingView.classList.remove('hidden');
        }

        // --- Event Listeners ควบคุมปุ่มต่างๆ ---

        backToMainBtn.addEventListener('click', () => {
            chaptersView.classList.add('hidden');
            mainView.classList.remove('hidden');
        });

        backToChaptersBtn.addEventListener('click', () => {
            docIframe.src = 'about:blank'; 
            readingView.classList.add('hidden');
            chaptersView.classList.remove('hidden');
        });
        
        // กรองข้อมูลเมื่อเปลี่ยนตัวเลือก
        typeFilter.addEventListener('change', renderSeries);
        categoryFilter.addEventListener('change', renderSeries);

        docIframe.addEventListener('load', () => {
            setTimeout(() => {
                iframeLoading.style.display = 'none';
            }, 500);
        });

        window.addEventListener('DOMContentLoaded', fetchNovelsData);

    </script>
</body>
</html>
